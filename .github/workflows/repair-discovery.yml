name: Repair ApplyBot discovery

on:
  push:
    paths:
      - "repair_discovery.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch discovery pipeline
        run: python patch_discovery.py
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm -f repair_discovery.trigger || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden discovery providers and diagnostics [applybot-fix]"
          git push
