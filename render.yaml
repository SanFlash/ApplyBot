services:
  - type: web
    name: applybot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 240 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTO_APPLY_ENABLED
        value: "true"
      - key: AUTO_APPLY_MAX
        value: "3"
      - key: CANDIDATE_EMAIL
        sync: false
      - key: CANDIDATE_PHONE
        sync: false
      - key: RESUME_PATH
        sync: false
      - key: FREE_JOB_DATASET_ENABLED
        value: "true"
      - key: FREE_JOB_DATASET_URL
        value: "https://cdn.jsdelivr.net/gh/ConorsCode/open-jobs-data@main/data/jobs.json"
      - key: FREE_JOB_DATASET_TIMEOUT
        value: "30"
      - key: FREE_JOB_DATASET_CACHE_SECONDS
        value: "900"
