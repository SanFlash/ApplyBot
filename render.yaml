services:
  - type: web
    name: applybot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 240 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTO_APPLY_ENABLED
        value: "true"
      - key: AUTO_APPLY_MAX
        value: "3"
      - key: CANDIDATE_EMAIL
        sync: false
      - key: CANDIDATE_PHONE
        sync: false
      - key: JOBICY_API_URL
        value: "https://jobicy.com/api/v2/remote-jobs"
      - key: JOBICY_API_KEY
        sync: false
      - key: JOBICY_COUNT
        value: "200"
      - key: JOBICY_TIMEOUT
        value: "30"
      - key: ENABLE_LEGACY_SOURCES
        value: "false"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: GREENHOUSE_BOARDS
        value: ""
      - key: LEVER_COMPANIES
        value: ""
      - key: RESUME_PATH
        sync: false
