services:
  - type: web
    name: applybot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTO_APPLY_ENABLED
        value: "false"
      - key: AUTO_APPLY_MAX
        value: "3"
      - key: CANDIDATE_EMAIL
        sync: false
      - key: CANDIDATE_PHONE
        sync: false
      - key: RESUME_PATH
        sync: false
